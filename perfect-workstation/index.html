<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ece1" />
  <title>完美工位 · 像素治愈放置</title>
  <link rel="icon" href="assets/items/081.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="hud">
      <button class="lv-badge" id="lvBadge"><b id="lvNum">1</b><span class="xp"><i id="xpBar"></i></span></button>
      <div class="cur coin" id="coinBox"><i class="pi ico-coin" style="background-image:url(assets/icons/48/hud_coin.png)"></i><b id="coinNum">0</b></div>
      <div class="cur gem" id="gemBox"><i class="pi ico-gem" style="background-image:url(assets/icons/48/hud_gem.png)"></i><b id="gemNum">0</b><button class="plus" data-go="shop:gem">+</button></div>
      <button class="hud-btn" id="soundBtn" aria-label="音效"><i class="pi s-on" style="background-image:url(assets/icons/48/hud_sound_on.png)"></i><i class="pi s-off" style="background-image:url(assets/icons/48/hud_sound_off.png)"></i></button>
    </header>
    <main class="pages">
      <section class="page active" id="page-desk"></section>
      <section class="page" id="page-bag"></section>
      <section class="page" id="page-shop"></section>
      <section class="page" id="page-book"></section>
      <section class="page" id="page-me"></section>
    </main>
    <nav class="tabbar" id="tabbar">
      <button data-tab="desk" class="active"><i class="ti"><i class="pi off" style="background-image:url(assets/icons/48/nav_workstation_normal.png)"></i><i class="pi on" style="background-image:url(assets/icons/48/nav_workstation_selected.png)"></i></i><span>工位</span></button>
      <button data-tab="bag"><i class="ti"><i class="pi off" style="background-image:url(assets/icons/48/nav_bag_normal.png)"></i><i class="pi on" style="background-image:url(assets/icons/48/nav_bag_selected.png)"></i></i><span>背包</span></button>
      <button data-tab="shop"><i class="ti"><i class="pi off" style="background-image:url(assets/icons/48/nav_shop_normal.png)"></i><i class="pi on" style="background-image:url(assets/icons/48/nav_shop_selected.png)"></i></i><span>商店</span><em class="dot" id="dotShop"></em></button>
      <button data-tab="book"><i class="ti"><i class="pi off" style="background-image:url(assets/icons/48/nav_collection_normal.png)"></i><i class="pi on" style="background-image:url(assets/icons/48/nav_collection_selected.png)"></i></i><span>图鉴</span><em class="dot" id="dotBook"></em></button>
      <button data-tab="me"><i class="ti"><i class="pi off" style="background-image:url(assets/icons/48/nav_me_normal.png)"></i><i class="pi on" style="background-image:url(assets/icons/48/nav_me_selected.png)"></i></i><span>我的</span><em class="dot" id="dotMe"></em></button>
    </nav>
    <div class="sheet-mask" id="sheetMask" hidden></div>
    <div class="sheet" id="sheet" hidden></div>
    <div class="modal-mask" id="modalMask" hidden><div class="modal" id="modal"></div></div>
    <div class="toast-wrap" id="toastWrap"></div>
  </div>
  <script src="js/platform.js"></script>
  <script src="js/natural.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
